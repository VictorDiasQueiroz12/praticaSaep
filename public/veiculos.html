    <h2>Veículos</h2>

        <input type="hidden" id="id">

        <input id="modelo" placeholder="Modelo" required>

        <select id="id_cliente" required></select>
        <button>Salvar</button>

    <table>
        <thead>
            <tr>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Ano</th>
                <th>Cliente</th>
                <th>Ações</th>
            </tr>

    </table>
